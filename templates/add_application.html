<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>
        Add New Job application
    </h1>
    <form action="/user/add_application" method="post"  enctype="multipart/form-data">
        Job Position:
        <input type="text" name="job_position"><br><br>
        Company:
        <input type="text" name="company"><br><br>
        CV:
        <input type="file" name="cv_file"><br><br>
        Website:
        <input type="text" name="website"><br><br>
        Job Type:
        <input type="text" name="job_type"><br><br>
        Job location:
        <input type="text" name="job_location"><br><br>
        <button type="submit"> Add Application</button>
      
    </form>
</body>
</html>
